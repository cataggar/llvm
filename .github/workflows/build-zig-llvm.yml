name: Build LLVM for Zig

on:
  push:
    tags:
      - "llvm-zig-*"
      - "llvmorg-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. llvm-zig-22.1.2)"
        required: true
      target:
        description: "Build only this target (leave empty for all)"
        required: false
      tools_only:
        description: "Publish only a new Linux tools asset to an existing release"
        type: boolean
        default: false

permissions: {}

env:
  LLVM_PROJECTS: "lld;clang"
  CMAKE_BUILD_TYPE: Release
  GHR_VERSION: "v0.5.1"
  ZIG_SPEC: "cataggar/zig@v0.17.0"
  ZIG_MINISIGN: "RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-linux
            archive: tar.xz
            zig-target: x86_64-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-linux
            archive: tar.xz
            zig-target: aarch64-linux-musl
          - os: windows-2025
            target: x86_64-windows-msvc
            archive: zip
          - os: macos-15
            target: aarch64-macos
            archive: tar.xz
          - os: macos-15
            target: x86_64-macos
            archive: tar.xz
            zig-target: x86_64-macos
            cmake-extra: "-DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_SYSTEM_NAME=Darwin -DCMAKE_SYSTEM_PROCESSOR=x86_64"

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    steps:
      - name: Check target filter
        id: filter
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          TOOLS_ONLY: ${{ inputs.tools_only || false }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ "${TOOLS_ONLY}" = true ]; then
            case "${TARGET}" in
              x86_64-linux|aarch64-linux) ;;
              *)
                echo "tools_only requires target=x86_64-linux or aarch64-linux"
                exit 1
                ;;
            esac
            if [[ ! "${RELEASE_TAG}" =~ ^(llvm-zig-|llvmorg-)[0-9]+\.[0-9]+\.[0-9]+(-p[0-9]+)?$ ]]; then
              echo "tools_only requires a versioned llvm-zig-* or llvmorg-* release tag"
              exit 1
            fi
          fi
          if [ -n "$TARGET" ] && [ "$TARGET" != "${{ matrix.target }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.target }} (filter: $TARGET)"
          fi

      - name: Determine ref
        if: steps.filter.outputs.skip != 'true'
        id: ref
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          # Release tag may be llvm-zig-<version>, llvm-zig-<version>-p<N>, or
          # llvmorg-<version>; the LLVM source is checked out from
          # llvmorg-<base_version>.
          VERSION="${TAG#llvm-zig-}"
          VERSION="${VERSION#llvmorg-}"
          BASE_VERSION="${VERSION%-p[0-9]*}"
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "base_version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "llvm_ref=llvmorg-${BASE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout LLVM
        if: steps.filter.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: llvm/llvm-project
          ref: ${{ steps.ref.outputs.llvm_ref }}

      - name: Checkout patches
        if: steps.filter.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .mirror-patches
          sparse-checkout: patches
          clean: false

      - name: Apply patches
        if: steps.filter.outputs.skip != 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.ref.outputs.release_tag }}
        run: |
          shopt -s nullglob
          PATCH_DIR=".mirror-patches/patches/${RELEASE_TAG}"
          patches=("${PATCH_DIR}"/[0-9][0-9][0-9][0-9]-*.patch)
          if [[ "${RELEASE_TAG}" =~ -p[0-9]+$ ]] && [ "${#patches[@]}" -eq 0 ]; then
            echo "ERROR: ${RELEASE_TAG} is a patched release tag, but no patches were found in patches/${RELEASE_TAG}/"
            exit 1
          fi
          for patch in "${patches[@]}"; do
            name="$(basename "${patch}")"
            if command -v sha256sum >/dev/null 2>&1; then
              sha="$(sha256sum "${patch}" | cut -d' ' -f1)"
            else
              sha="$(shasum -a 256 "${patch}" | cut -d' ' -f1)"
            fi
            echo "Applying ${name} (sha256:${sha})"
            git apply --check "${patch}"
            git apply "${patch}"
          done
          rm -rf .mirror-patches

      - name: Drop clang Info.plist -sectcreate (macOS)
        if: steps.filter.outputs.skip != 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          # The clang driver embeds an Info.plist via `-Wl,-sectcreate,...`,
          # which zig cc's Mach-O linker rejects ("unsupported linker arg:
          # -sectcreate"). Bun/Zig don't need the embedded plist, so strip the
          # target_link_libraries() call that adds it. (-sectcreate appears only
          # here for the projects we build; lld/dsymutil don't use it.)
          f=clang/tools/driver/CMakeLists.txt
          perl -0pi -e 's/\s*target_link_libraries\(\$\{TARGET_NAME\}.*?sectcreate.*?\)//s' "$f"
          if grep -q sectcreate "$f"; then
            echo "ERROR: failed to strip -sectcreate from $f"; exit 1
          fi
          echo "Patched $f (removed -sectcreate Info.plist link flag)."

      - name: Free disk space (Linux)
        if: steps.filter.outputs.skip != 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          # Building all LLVM/Clang/LLD tool binaries (tools ON) and then
          # installing them needs much more disk than a libs-only build. Remove
          # large preinstalled toolchains we don't use to avoid running out of
          # space during the Install step.
          echo "=== before ==="; df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/share/swift \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          echo "=== after ==="; df -h /

      - name: Set archive name
        if: steps.filter.outputs.skip != 'true'
        id: names
        shell: bash
        run: |
          VERSION="${{ steps.ref.outputs.version }}"
          NAME="llvm-zig-${VERSION}-${{ matrix.target }}"
          TOOLS_NAME="llvm-tools-${VERSION}-${{ matrix.target }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "archive=${NAME}.${{ matrix.archive }}" >> "$GITHUB_OUTPUT"
          echo "tools_name=${TOOLS_NAME}" >> "$GITHUB_OUTPUT"
          echo "tools_archive=${TOOLS_NAME}.tar.xz" >> "$GITHUB_OUTPUT"

      - name: Check tools-only release destination
        if: steps.filter.outputs.skip != 'true' && inputs.tools_only
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.ref.outputs.release_tag }}
          ASSET: ${{ steps.names.outputs.tools_archive }}
        run: |
          ASSETS="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')"
          if grep -Fxq "${ASSET}" <<< "${ASSETS}"; then
            echo "Refusing to replace existing release asset: ${ASSET}"
            exit 1
          fi

      - name: Install Ninja (Linux)
        if: steps.filter.outputs.skip != 'true' && runner.os == 'Linux'
        run: sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: steps.filter.outputs.skip != 'true' && runner.os == 'macOS'
        run: brew install ninja

      - name: Setup MSVC (Windows)
        if: steps.filter.outputs.skip != 'true' && runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (Windows)
        if: steps.filter.outputs.skip != 'true' && runner.os == 'Windows'
        run: choco install ninja -y

      - name: Install ghr (Unix)
        if: steps.filter.outputs.skip != 'true' && runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/cataggar/ghr/main/install.sh \
            | GHR_VERSION="${{ env.GHR_VERSION }}" GHR_NO_PATH_ADD=1 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Zig via ghr (Unix)
        if: steps.filter.outputs.skip != 'true' && runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ghr install "${{ env.ZIG_SPEC }}" "${{ env.ZIG_MINISIGN }}"
          echo "ZIG=$(command -v zig)" >> "$GITHUB_ENV"
          zig version

      - name: Create Zig CC wrappers
        if: steps.filter.outputs.skip != 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "${{ github.workspace }}/zigwrap"
          ZIG_TARGET="${{ matrix.zig-target }}"
          if [ -n "$ZIG_TARGET" ] && [ "${{ runner.os }}" = "macOS" ]; then
            SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
            printf '#!/bin/sh\nexec "%s" cc -target %s -iframework "%s/System/Library/Frameworks" -F"%s/System/Library/Frameworks" -L"%s/usr/lib" "$@"\n' \
              "$ZIG" "$ZIG_TARGET" "$SDKROOT" "$SDKROOT" "$SDKROOT" > "${{ github.workspace }}/zigwrap/zigcc"
            printf '#!/bin/sh\nexec "%s" c++ -target %s -iframework "%s/System/Library/Frameworks" -F"%s/System/Library/Frameworks" -L"%s/usr/lib" "$@"\n' \
              "$ZIG" "$ZIG_TARGET" "$SDKROOT" "$SDKROOT" "$SDKROOT" > "${{ github.workspace }}/zigwrap/zigcxx"
          elif [ -n "$ZIG_TARGET" ]; then
            printf '#!/bin/sh\nexec "%s" cc -target %s "$@"\n' "$ZIG" "$ZIG_TARGET" > "${{ github.workspace }}/zigwrap/zigcc"
            printf '#!/bin/sh\nexec "%s" c++ -target %s "$@"\n' "$ZIG" "$ZIG_TARGET" > "${{ github.workspace }}/zigwrap/zigcxx"
          else
            printf '#!/bin/sh\nexec "%s" cc "$@"\n' "$ZIG" > "${{ github.workspace }}/zigwrap/zigcc"
            printf '#!/bin/sh\nexec "%s" c++ "$@"\n' "$ZIG" > "${{ github.workspace }}/zigwrap/zigcxx"
          fi
          chmod +x "${{ github.workspace }}/zigwrap/zigcc" "${{ github.workspace }}/zigwrap/zigcxx"

      - name: Configure LLVM (Unix)
        if: steps.filter.outputs.skip != 'true' && runner.os != 'Windows'
        run: |
          cmake -S llvm -B build -G Ninja \
            -DCMAKE_C_COMPILER="${{ github.workspace }}/zigwrap/zigcc" \
            -DCMAKE_CXX_COMPILER="${{ github.workspace }}/zigwrap/zigcxx" \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
            -DLLVM_ENABLE_PROJECTS="${{ env.LLVM_PROJECTS }}" \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_ENABLE_OCAMLDOC=OFF \
            -DLLVM_ENABLE_Z3_SOLVER=OFF \
            -DLLVM_BUILD_TOOLS=ON \
            -DLLVM_BUILD_UTILS=ON \
            -DCLANG_BUILD_TOOLS=ON \
            -DLLD_BUILD_TOOLS=ON \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_ENABLE_PLUGINS=OFF \
            -DCLANG_TOOL_LIBCLANG_BUILD=OFF \
            -DCLANG_TOOL_CLANG_SHLIB_BUILD=OFF \
            -DCLANG_TOOL_C_INDEX_TEST_BUILD=OFF \
            -DLLVM_TOOL_LTO_BUILD=OFF \
            -DLLVM_TOOL_REMARKS_SHLIB_BUILD=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            -DCLANG_INCLUDE_DOCS=OFF \
            ${{ matrix.cmake-extra }}

      - name: Configure LLVM (Windows)
        if: steps.filter.outputs.skip != 'true' && runner.os == 'Windows'
        run: |
          cmake -S llvm -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DLLVM_ENABLE_PROJECTS="${{ env.LLVM_PROJECTS }}" `
            -DLLVM_ENABLE_ZLIB=OFF `
            -DLLVM_ENABLE_ZSTD=OFF `
            -DLLVM_ENABLE_LIBXML2=OFF `
            -DLLVM_ENABLE_TERMINFO=OFF `
            -DLLVM_ENABLE_BINDINGS=OFF `
            -DLLVM_ENABLE_ASSERTIONS=OFF `
            -DLLVM_ENABLE_OCAMLDOC=OFF `
            -DLLVM_ENABLE_Z3_SOLVER=OFF `
            -DLLVM_USE_CRT_RELEASE=MT `
            -DLLVM_BUILD_TOOLS=ON `
            -DLLVM_BUILD_UTILS=ON `
            -DCLANG_BUILD_TOOLS=ON `
            -DLLD_BUILD_TOOLS=ON `
            -DLLVM_BUILD_LLVM_DYLIB=OFF `
            -DLLVM_ENABLE_PLUGINS=OFF `
            -DCLANG_TOOL_LIBCLANG_BUILD=OFF `
            -DCLANG_TOOL_CLANG_SHLIB_BUILD=OFF `
            -DCLANG_TOOL_C_INDEX_TEST_BUILD=OFF `
            -DLLVM_TOOL_LTO_BUILD=OFF `
            -DLLVM_TOOL_REMARKS_SHLIB_BUILD=OFF `
            -DLLVM_INCLUDE_TESTS=OFF `
            -DLLVM_INCLUDE_BENCHMARKS=OFF `
            -DLLVM_INCLUDE_EXAMPLES=OFF `
            -DLLVM_INCLUDE_DOCS=OFF `
            -DCLANG_INCLUDE_TESTS=OFF `
            -DCLANG_INCLUDE_DOCS=OFF

      - name: Build
        if: steps.filter.outputs.skip != 'true'
        run: cmake --build build --config ${{ env.CMAKE_BUILD_TYPE }}

      - name: Free disk space before install
        if: steps.filter.outputs.skip != 'true'
        shell: bash
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h .
          # Remove object files (already archived into .a libs) — this is the
          # bulk of the freed space.
          find build -name '*.o' -delete 2>/dev/null || true
          # Remove source dirs for projects that are NOT built or installed.
          # Keep llvm, clang, lld (and cmake): `cmake --install` copies source
          # files (e.g. clang/utils/bash-autocomplete.sh, llvm/include headers)
          # directly out of these trees, so deleting them breaks the install.
          rm -rf bolt cross-project-tests flang libc libclc \
                 libcxx libcxxabi libunwind lldb mlir openmp polly pstl \
                 runtimes compiler-rt 2>/dev/null || true
          echo "=== Disk usage after cleanup ==="
          df -h .

      - name: Install
        if: steps.filter.outputs.skip != 'true'
        run: cmake --install build --config ${{ env.CMAKE_BUILD_TYPE }}

      - name: Stage LLVM tools archive
        if: steps.filter.outputs.skip != 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          TOOLS_DIR="${{ steps.names.outputs.tools_name }}"
          INSTALL_BIN="$(readlink -f install/bin)"
          mkdir -p "${TOOLS_DIR}/bin"
          cp LICENSE.TXT "${TOOLS_DIR}/LICENSE.TXT"

          declare -A copied=()
          copy_with_targets() {
            local current="${INSTALL_BIN}/$1"
            local final link_target

            final="$(readlink -e "${current}")" || {
              echo "Missing or broken required tool: $1"
              exit 1
            }
            case "${final}" in
              "${INSTALL_BIN}"/*) ;;
              *)
                echo "Tool $1 resolves outside install/bin: ${final}"
                exit 1
                ;;
            esac

            while :; do
              case "${current}" in
                "${INSTALL_BIN}"/*) ;;
                *)
                  echo "Symlink target resolves outside install/bin: ${current}"
                  exit 1
                  ;;
              esac
              if [[ -z "${copied[${current}]+x}" ]]; then
                cp -a -- "${current}" "${TOOLS_DIR}/bin/"
                copied["${current}"]=1
              fi
              [ -L "${current}" ] || break
              link_target="$(readlink "${current}")"
              if [[ "${link_target}" = /* ]]; then
                echo "Non-relocatable absolute symlink: ${current} -> ${link_target}"
                exit 1
              fi
              current="$(realpath -m -s "$(dirname "${current}")/${link_target}")"
            done
          }

          for tool in llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
            copy_with_targets "${tool}"
          done

          for tool in llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
            if [ ! -x "${TOOLS_DIR}/bin/${tool}" ]; then
              echo "Packaged tool is missing or not executable: ${tool}"
              exit 1
            fi
          done

          # These musl-targeted tools should not need any runtime libraries.
          case "${{ matrix.target }}" in
            aarch64-linux) MACHINE="AArch64" ;;
            x86_64-linux) MACHINE="Advanced Micro Devices X86-64" ;;
          esac
          for binary in "${TOOLS_DIR}"/bin/*; do
            [ -L "${binary}" ] && continue
            HEADER="$(readelf -h "${binary}")"
            if ! grep -Eq "Machine: +${MACHINE}$" <<< "${HEADER}"; then
              echo "Unexpected tool architecture in ${binary}:"
              echo "${HEADER}"
              exit 1
            fi
            PROGRAM_HEADERS="$(readelf -l "${binary}")"
            DYNAMIC="$(readelf -d "${binary}")"
            if grep -q 'Requesting program interpreter' <<< "${PROGRAM_HEADERS}" ||
               grep -q '(NEEDED)' <<< "${DYNAMIC}"; then
              echo "Unexpected dynamic runtime dependency in ${binary}:"
              echo "${PROGRAM_HEADERS}"
              echo "${DYNAMIC}"
              exit 1
            fi
          done

          echo "Staged LLVM tools:"
          find "${TOOLS_DIR}" -maxdepth 2 -printf '%y %p -> %l\n' | sort

      - name: Prune install (remove unnecessary files)
        if: steps.filter.outputs.skip != 'true'
        shell: bash
        run: |
          cd install

          # Remove shared libraries: Zig links statically and (DYLIB=OFF) the
          # tool binaries in bin/ are statically linked, so nothing needs these.
          find lib -name '*.so*' -delete 2>/dev/null || true
          find lib -name '*.dylib' -delete 2>/dev/null || true

          # Slim bin/ to just the toolchain binaries Bun needs (+ the symlink
          # targets they resolve to). Building with tools ON produces ~150 LLVM
          # tools; shipping all of them pushes the archive past GitHub's 2 GB
          # release-asset limit and makes xz extremely slow. Zig ignores bin/
          # entirely (it links the static libs), so only Bun's tools must stay:
          #   linux:   clang clang++ llvm-ar llvm-ranlib ld.lld
          #   macos:   + llvm-strip dsymutil
          #   windows: clang-cl llvm-lib lld-link llvm-rc
          # (their real binaries are clang-<N>, lld, llvm-ar, llvm-objcopy).
          (
            cd bin || exit 0
            allow='^(clang|clang\+\+|clang-cl|clang-cpp|clang-[0-9]+|lld|ld\.lld|ld64\.lld|lld-link|wasm-ld|llvm-ar|llvm-ranlib|llvm-lib|llvm-dlltool|llvm-objcopy|llvm-strip|llvm-install-name-tool|llvm-bitcode-strip|llvm-rc|dsymutil)(\.exe)?$'
            keep=""
            for f in *; do
              if printf '%s\n' "$f" | grep -Eq "$allow"; then
                keep="$keep $f"
                if [ -L "$f" ]; then
                  t=$(readlink -f "$f" 2>/dev/null)
                  [ -n "$t" ] && keep="$keep $(basename "$t")"
                fi
              fi
            done
            for f in *; do
              case " $keep " in *" $f "*) ;; *) rm -f "$f";; esac
            done
            echo "Kept toolchain binaries:"; ls -1
          )

          # Remove libexec, share (needed by neither Zig nor Bun)
          rm -rf libexec share

      - name: Create stub z and zstd libs (Unix)
        if: steps.filter.outputs.skip != 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          cd install/lib
          # LLVM is built with ZLIB/ZSTD OFF, but downstream link lines may still
          # pass -lz/-lzstd, so provide empty stub archives to satisfy them.
          # macOS `ar` refuses to create an archive with no members
          # ("ar: no archive members specified"), so archive one stub object.
          # Compile it with the same zig cc wrapper to match the target arch.
          echo 'int _llvm_zig_stub(void) { return 0; }' > _stub.c
          "${{ github.workspace }}/zigwrap/zigcc" -c _stub.c -o _stub.o
          ar rcs libz.a _stub.o
          ar rcs libzstd.a _stub.o
          rm -f _stub.c _stub.o

      - name: Create stub z and zstd libs (Windows)
        if: steps.filter.outputs.skip != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          cd install\lib
          echo "" > empty.c
          cl /nologo /c empty.c
          lib /nologo /OUT:z.lib empty.obj
          lib /nologo /OUT:zstd.lib empty.obj
          Remove-Item empty.c, empty.obj

      - name: Verify required tool binaries (Unix)
        if: steps.filter.outputs.skip != 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          cd install/bin
          required="clang clang++ llvm-ar llvm-ranlib ld.lld"
          if [ "${{ runner.os }}" = "macOS" ]; then
            required="$required llvm-strip dsymutil"
          fi
          missing=""
          for t in $required; do
            [ -x "$t" ] || missing="$missing $t"
          done
          if [ -n "$missing" ]; then
            echo "Missing required tool binaries:$missing"
            echo "--- install/bin contents ---"; ls -1
            exit 1
          fi
          echo "All required tool binaries present:$required"

      - name: Verify required tool binaries (Windows)
        if: steps.filter.outputs.skip != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          cd install/bin
          # NOTE: llvm-mt is intentionally excluded — it is only built when
          # LLVM_ENABLE_LIBXML2 is ON, but we keep libxml2 OFF for Zig
          # compatibility, so llvm-mt is never produced (see cataggar/llvm-project#5).
          $required = @('clang-cl','llvm-lib','lld-link','llvm-rc')
          $missing = @()
          foreach ($t in $required) {
            if (-not (Test-Path "$t.exe")) { $missing += $t }
          }
          if ($missing.Count -gt 0) {
            Write-Host "Missing required tool binaries: $($missing -join ' ')"
            Write-Host "--- install/bin contents ---"; Get-ChildItem -Name
            exit 1
          }
          Write-Host "All required tool binaries present: $($required -join ' ')"

      - name: Create LLVM tools archive
        if: steps.filter.outputs.skip != 'true' && runner.os == 'Linux'
        env:
          XZ_OPT: "-T0"
        shell: bash
        run: |
          TOOLS_NAME="${{ steps.names.outputs.tools_name }}"
          TOOLS_ARCHIVE="${{ steps.names.outputs.tools_archive }}"
          EXTRACTED_BYTES="$(du -sb "${TOOLS_NAME}" | cut -f1)"
          tar -cJf "${TOOLS_ARCHIVE}" "${TOOLS_NAME}"
          COMPRESSED_BYTES="$(stat -c %s "${TOOLS_ARCHIVE}")"
          SHA256="$(sha256sum "${TOOLS_ARCHIVE}" | cut -d' ' -f1)"

          echo "Extracted size: ${EXTRACTED_BYTES} bytes ($(du -sh "${TOOLS_NAME}" | cut -f1))"
          echo "Compressed size: ${COMPRESSED_BYTES} bytes ($(du -h "${TOOLS_ARCHIVE}" | cut -f1))"
          {
            echo "### ${TOOLS_ARCHIVE}"
            echo
            echo "| Size | Bytes | Human-readable |"
            echo "|---|---:|---:|"
            echo "| Extracted | ${EXTRACTED_BYTES} | $(du -sh "${TOOLS_NAME}" | cut -f1) |"
            echo "| Compressed | ${COMPRESSED_BYTES} | $(du -h "${TOOLS_ARCHIVE}" | cut -f1) |"
            echo
            echo "SHA-256: \`${SHA256}\`"
            echo "Upstream LLVM commit: \`$(git rev-parse HEAD)\`"
            echo "Workflow commit: \`${GITHUB_SHA}\`"
            echo "Zig: \`$("${ZIG}" version)\` (\`${ZIG_SPEC}\`)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify LLVM tools archive in clean Ubuntu
        if: steps.filter.outputs.skip != 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          TOOLS_NAME="${{ steps.names.outputs.tools_name }}"
          TOOLS_ARCHIVE="${{ steps.names.outputs.tools_archive }}"
          VALIDATION_DIR="${{ github.workspace }}/llvm-tools-validation"
          rm -rf "${VALIDATION_DIR}"
          mkdir -p "${VALIDATION_DIR}"
          tar -xJf "${TOOLS_ARCHIVE}" -C "${VALIDATION_DIR}"

          printf 'int packaged_symbol(void) { return 7; }\n' > "${VALIDATION_DIR}/sample.c"
          "${ZIG}" cc -target x86_64-linux-musl -g -c \
            "${VALIDATION_DIR}/sample.c" -o "${VALIDATION_DIR}/sample.o"

          cat > "${VALIDATION_DIR}/verify-tools.sh" <<'EOF'
          set -euo pipefail
          test "$(uname -m)" = "${EXPECTED_ARCH}"
          for tool in llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
            "${TOOLS_ROOT}/bin/${tool}" --version | grep -F "version ${LLVM_VERSION}"
          done
          "${TOOLS_ROOT}/bin/llvm-nm" sample.o | grep -F packaged_symbol
          "${TOOLS_ROOT}/bin/llvm-objdump" -d sample.o | grep -F packaged_symbol
          "${TOOLS_ROOT}/bin/llvm-readelf" -h sample.o | grep -F 'Advanced Micro Devices X86-64'
          "${TOOLS_ROOT}/bin/llvm-readelf" -S sample.o | grep -F '.debug_info'
          "${TOOLS_ROOT}/bin/llvm-objcopy" sample.o sample-copy.o
          "${TOOLS_ROOT}/bin/llvm-strip" --strip-debug sample-copy.o
          "${TOOLS_ROOT}/bin/llvm-readelf" -h sample-copy.o | grep -F 'Advanced Micro Devices X86-64'
          "${TOOLS_ROOT}/bin/llvm-nm" sample-copy.o | grep -F packaged_symbol
          SECTIONS="$("${TOOLS_ROOT}/bin/llvm-readelf" -S sample-copy.o)"
          if grep -Fq '.debug_' <<< "${SECTIONS}"; then
            echo "Debug sections remain after stripping"
            exit 1
          fi
          EOF

          docker run --rm \
            -v "${VALIDATION_DIR}:/work" \
            -w /work \
            -e "TOOLS_ROOT=/work/${TOOLS_NAME}" \
            -e "LLVM_VERSION=${{ steps.ref.outputs.base_version }}" \
            -e "EXPECTED_ARCH=${{ startsWith(matrix.target, 'aarch64-') && 'aarch64' || 'x86_64' }}" \
            ubuntu:24.04 \
            bash verify-tools.sh

      - name: Upload tools consumer fixture
        if: steps.filter.outputs.skip != 'true' && inputs.tools_only
        uses: actions/upload-artifact@v4
        with:
          name: tools-acceptance-${{ matrix.target }}
          path: |
            llvm-tools-validation/sample.o
            llvm-tools-validation/verify-tools.sh
          if-no-files-found: error
          retention-days: 1

      - name: Create archive (tar.xz)
        if: steps.filter.outputs.skip != 'true' && !inputs.tools_only && matrix.archive == 'tar.xz'
        env:
          # Multi-threaded xz; falls back gracefully where unsupported.
          XZ_OPT: "-T0"
        run: |
          mv install ${{ steps.names.outputs.name }}
          tar -cJf ${{ steps.names.outputs.archive }} ${{ steps.names.outputs.name }}
          ls -lh ${{ steps.names.outputs.archive }}

      - name: Create archive (zip)
        if: steps.filter.outputs.skip != 'true' && !inputs.tools_only && matrix.archive == 'zip'
        shell: bash
        run: |
          mv install ${{ steps.names.outputs.name }}
          7z a ${{ steps.names.outputs.archive }} ${{ steps.names.outputs.name }}

      - name: Upload artifact
        if: steps.filter.outputs.skip != 'true' && !inputs.tools_only
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.name }}
          path: ${{ steps.names.outputs.archive }}
          retention-days: 1

      - name: Upload LLVM tools artifact
        if: steps.filter.outputs.skip != 'true' && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.tools_name }}
          path: ${{ steps.names.outputs.tools_archive }}
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    if: ${{ !cancelled() && (!inputs.tools_only || needs.build.result == 'success') }}
    runs-on: ${{ inputs.tools_only && inputs.target == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - name: Checkout mirror metadata
        uses: actions/checkout@v4
        with:
          sparse-checkout: patches

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: llvm-*
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -lh dist/ 2>/dev/null || echo "No assets produced"

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#llvm-zig-}"
          VERSION="${VERSION#llvmorg-}"
          BASE_VERSION="${VERSION%-p[0-9]*}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "base_version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "llvm_ref=llvmorg-${BASE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        if: ${{ !inputs.tools_only }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          BASE_VERSION="${{ steps.version.outputs.base_version }}"
          UPSTREAM_TAG="${{ steps.version.outputs.llvm_ref }}"

          # Only upload if there are assets (skipped builds produce none)
          if [ -z "$(ls -A dist/ 2>/dev/null)" ]; then
            echo "No assets to upload — all builds were skipped or failed"
            exit 0
          fi

          LS_REMOTE="$(git ls-remote https://github.com/llvm/llvm-project.git "refs/tags/${UPSTREAM_TAG}^{}" "refs/tags/${UPSTREAM_TAG}")"
          UPSTREAM_SHA="$(awk '/\^\{\}$/ { print $1; exit }' <<< "${LS_REMOTE}")"
          if [ -z "${UPSTREAM_SHA}" ]; then
            UPSTREAM_SHA="$(awk 'NR==1 { print $1; exit }' <<< "${LS_REMOTE}")"
          fi
          if [ -z "${UPSTREAM_SHA}" ]; then
            echo "ERROR: failed to resolve upstream tag ${UPSTREAM_TAG}"
            exit 1
          fi

          NOTES="LLVM ${VERSION} prebuilt for Zig compilation, now also shipping the Clang/LLD toolchain binaries (for Bun / buz). Projects: clang, lld. Static CRT (Windows: /MT). No zlib, zstd, libxml2, terminfo dependencies.

          Zig (static libs): \`zig build -Dstatic-llvm --search-prefix <extracted-dir>\`
          CMake: \`cmake -DCMAKE_PREFIX_PATH=<extracted-dir> ..\`
          Toolchain (Bun): point the toolchain search at \`<extracted-dir>/bin\` (clang, clang++, llvm-ar, llvm-ranlib, ld.lld, …).
          LLVM tools (Linux): the \`llvm-tools-${VERSION}-<target>.tar.xz\` assets for x86_64-linux and aarch64-linux contain llvm-nm, llvm-objcopy, llvm-objdump, llvm-readelf, and llvm-strip.

          Upstream source: \`${UPSTREAM_TAG}\` (\`${UPSTREAM_SHA}\`)"

          shopt -s nullglob
          patches=("patches/${TAG}"/[0-9][0-9][0-9][0-9]-*.patch)
          if [[ "${TAG}" =~ -p[0-9]+$ ]] && [ "${#patches[@]}" -eq 0 ]; then
            echo "ERROR: ${TAG} is a patched release tag, but no patches were found in patches/${TAG}/"
            exit 1
          fi
          if [ "${#patches[@]}" -gt 0 ]; then
            PATCH_LINES="Patches applied:"
            for patch in "${patches[@]}"; do
              name="$(basename "${patch}")"
              sha="$(sha256sum "${patch}" | cut -d' ' -f1)"
              issue="$(sed -nE 's/^[Tt]racking[- ][Ii]ssue:[[:space:]]*(#[0-9]+|https:\/\/[^[:space:]]+).*/\1/p' "${patch}" | head -n1)"
              if [ -z "${issue}" ]; then
                issue="$(grep -oE '#[0-9]+' "${patch}" | head -n1 || true)"
              fi
              if [ -n "${issue}" ]; then
                PATCH_LINES="${PATCH_LINES}"$'\n'"- \`${name}\` (\`sha256:${sha}\`, tracking issue: ${issue})"
              else
                PATCH_LINES="${PATCH_LINES}"$'\n'"- \`${name}\` (\`sha256:${sha}\`)"
              fi
            done
            NOTES="${NOTES}"$'\n\n'"${PATCH_LINES}"
          fi

          # Create release if it doesn't exist, or upload to existing.
          # Never --clobber a patched release; changing the patch set requires bumping -p<N>.
          if gh release view "${TAG}" --repo "${{ github.repository }}" &>/dev/null; then
            if [[ "${TAG}" =~ -p[0-9]+$ ]]; then
              EXISTING_ASSETS="$(gh release view "${TAG}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')"
              for path in dist/*; do
                asset="$(basename "${path}")"
                if grep -Fxq "${asset}" <<< "${EXISTING_ASSETS}"; then
                  echo "Refusing to clobber existing asset on patched release ${TAG}: ${asset}; bump -p<N> instead"
                  exit 1
                fi
              done
              echo "Patched release ${TAG} exists — uploading new assets without clobber"
              gh release upload "${TAG}" \
                --repo "${{ github.repository }}" \
                dist/*
            else
              echo "Release ${TAG} exists — uploading new/updated assets only"
              gh release upload "${TAG}" \
                --repo "${{ github.repository }}" \
                --clobber \
                dist/*
            fi
            if compgen -G "dist/llvm-tools-*" >/dev/null; then
              gh release edit "${TAG}" \
                --repo "${{ github.repository }}" \
                --notes "${NOTES}"
            fi
          else
            gh release create "${TAG}" \
              --repo "${{ github.repository }}" \
              --title "LLVM ${VERSION} for Zig" \
              --notes "${NOTES}" \
              dist/*
          fi

      - name: Publish a new tools-only asset
        if: inputs.tools_only
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ inputs.target }}
        run: |
          ASSET="llvm-tools-${VERSION}-${TARGET}.tar.xz"
          shopt -s nullglob dotglob
          assets=(dist/*)
          if [ "${#assets[@]}" -ne 1 ] || [ "${assets[0]}" != "dist/${ASSET}" ]; then
            echo "tools_only must publish exactly dist/${ASSET}"
            printf '%s\n' "${assets[@]}"
            exit 1
          fi

          gh api "repos/${GH_REPO}/releases/tags/${RELEASE_TAG}" > "${RUNNER_TEMP}/release-before.json"
          if jq -e --arg name "${ASSET}" '.assets[] | select(.name == $name)' \
            "${RUNNER_TEMP}/release-before.json" >/dev/null; then
            echo "Refusing to replace existing release asset: ${ASSET}"
            exit 1
          fi
          jq -S '[.assets[] | {id, name, size, digest}] | sort_by(.id)' \
            "${RUNNER_TEMP}/release-before.json" > "${RUNNER_TEMP}/assets-before.json"

          # No --clobber: a concurrent upload of this name must also fail safely.
          gh release upload "${RELEASE_TAG}" "dist/${ASSET}"
          gh api "repos/${GH_REPO}/releases/tags/${RELEASE_TAG}" > "${RUNNER_TEMP}/release-after.json"
          jq -S --arg name "${ASSET}" \
            '[.assets[] | select(.name != $name) | {id, name, size, digest}] | sort_by(.id)' \
            "${RUNNER_TEMP}/release-after.json" > "${RUNNER_TEMP}/assets-after.json"
          diff -u "${RUNNER_TEMP}/assets-before.json" "${RUNNER_TEMP}/assets-after.json"
          echo "Existing release asset IDs, sizes, and digests are unchanged." >> "$GITHUB_STEP_SUMMARY"

          jq -r '.body // ""' "${RUNNER_TEMP}/release-after.json" > "${RUNNER_TEMP}/release-notes.txt"
          if ! grep -Fq "${ASSET}" "${RUNNER_TEMP}/release-notes.txt"; then
            printf '\nLLVM tools (%s): `%s` contains llvm-nm, llvm-objcopy, llvm-objdump, llvm-readelf, and llvm-strip.\n' \
              "${TARGET}" "${ASSET}" >> "${RUNNER_TEMP}/release-notes.txt"
            gh release edit "${RELEASE_TAG}" --notes-file "${RUNNER_TEMP}/release-notes.txt"
          fi

      - name: Verify uploaded tools digests
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          shopt -s nullglob
          for path in dist/llvm-tools-*; do
            ASSET="$(basename "${path}")"
            DIGEST="$(gh api \
              "repos/${{ github.repository }}/releases/tags/${TAG}" \
              --jq ".assets[] | select(.name == \"${ASSET}\") | .digest")"
            EXPECTED="sha256:$(sha256sum "${path}" | cut -d' ' -f1)"
            if [ "${DIGEST}" != "${EXPECTED}" ]; then
              echo "GitHub SHA-256 digest mismatch for ${ASSET}: ${DIGEST:-<empty>} (expected ${EXPECTED})"
              exit 1
            fi
            echo "${ASSET}: ${DIGEST}"
            echo "\`${ASSET}\`: \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Download tools consumer fixture
        if: inputs.tools_only
        uses: actions/download-artifact@v4
        with:
          name: tools-acceptance-${{ inputs.target }}
          path: consumer-validation

      - name: Verify published tools via ghr
        if: inputs.tools_only
        shell: bash
        env:
          # Older ghr skips the llvm-readelf and llvm-strip symlink commands.
          GHR_VERSION: "v0.8.1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          ASSET_VERSION: ${{ steps.version.outputs.version }}
          LLVM_VERSION: ${{ steps.version.outputs.base_version }}
          TARGET: ${{ inputs.target }}
          EXPECTED_ARCH: ${{ startsWith(inputs.target, 'aarch64-') && 'aarch64' || 'x86_64' }}
          TOOLS_ROOT: ${{ runner.temp }}/llvm-tools-consumer
          GHR_BIN_DIR: ${{ runner.temp }}/llvm-tools-consumer/bin
          GHR_TOOL_DIR: ${{ runner.temp }}/llvm-tools-consumer/tools
          GHR_CACHE_DIR: ${{ runner.temp }}/llvm-tools-consumer/cache
        run: |
          curl -fsSL "https://raw.githubusercontent.com/cataggar/ghr/${GHR_VERSION}/install.sh" \
            | GHR_NO_PATH_ADD=1 sh
          ASSET="llvm-tools-${ASSET_VERSION}-${TARGET}.tar.xz"
          "${GHR_BIN_DIR}/ghr" install "${GH_REPO}/${ASSET}@${RELEASE_TAG}"
          for tool in llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
            resolved="$(readlink -e "${GHR_BIN_DIR}/${tool}")"
            case "${resolved}" in
              "${GHR_TOOL_DIR}"/*) ;;
              *)
                echo "${tool} does not resolve to the isolated ghr installation: ${resolved}"
                exit 1
                ;;
            esac
          done
          cd consumer-validation
          bash verify-tools.sh
          {
            echo "### Native ${EXPECTED_ARCH} consumer acceptance"
            echo "\`ghr install ${GH_REPO}/${ASSET}@${RELEASE_TAG}\`"
            echo "All five installed tools report LLVM ${LLVM_VERSION} and process a Zig-produced x86_64 ELF."
            echo "Only the explicit tools asset was requested; no full LLVM distribution was installed."
          } >> "$GITHUB_STEP_SUMMARY"
